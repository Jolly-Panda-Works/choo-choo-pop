name: Web demo
on:
  push:
    branches: [web-demo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-demo.mjs
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: choochoopop-web-demo
          path: dist
