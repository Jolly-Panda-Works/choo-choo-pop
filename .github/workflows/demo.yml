name: Web demo
on:
  push:
    branches: [main, web-demo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-demo.mjs
      - run: npm run build:demo
