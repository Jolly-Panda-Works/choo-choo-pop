name: Build Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [en, fa] # en = Choo Choo Pop, fa = هو هو چی چی
    env:
      EDITION: ${{ matrix.edition }}
      # Optional: add these 4 repo secrets to also get a signed release APK + AAB
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Test levels (20 levels, solvable + unique + difficulty curve)
        run: npm run test:levels

      - name: Build web (${{ matrix.edition }})
        run: VITE_EDITION=$EDITION npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Read version
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -PEDITION=$EDITION -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=$VERSION_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: choo-choo-pop-${{ matrix.edition }}-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release (APK + AAB)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PEDITION=$EDITION -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=$VERSION_NAME \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: choo-choo-pop-${{ matrix.edition }}-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
