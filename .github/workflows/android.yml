name: Build Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for the release'
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: read

# one release at a time, so two quick pushes never get the same version number
concurrency:
  group: build-${{ github.ref }}
  queue: max

jobs:
  # ---- 1. which version is this build? ----------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to find the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: v
        run: |
          version=$(git for-each-ref --format='%(refname:short) %(contents:subject)' 'refs/tags/v*' |
            awk -v run="android-build-run:$GITHUB_RUN_ID" '$2 == run { sub(/^v/, "", $1); print $1 }')
          if [[ -z "$version" ]]; then
            bump="${{ inputs.bump || 'auto' }}"
            if [[ "$bump" == auto ]]; then
              bump=$(node scripts/next-version.mjs --bump auto --print-bump)
            fi
            version=$(BUMP="$bump" node scripts/version.mjs)
          fi
          VERSION="$version"
          code=$(node --input-type=module -e 'import {versionCode} from "./scripts/version.mjs"; console.log(versionCode(process.argv[1]))' "$VERSION")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version $VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ---- 2. build the game ------------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VITE_STORE: debug
      VERSION_CODE: ${{ needs.prepare.outputs.code }}
      VERSION_NAME: ${{ needs.prepare.outputs.version }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6

      - name: Install
        run: npm ci

      - name: Test game
        run: npm test

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleStandaloneDebug --no-daemon -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME=$VERSION_NAME

      - uses: actions/upload-artifact@v7
        with:
          name: choo-choo-pop-en-debug-apk
          path: android/app/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error

      - name: Build signed release (APK + AAB)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleStandaloneRelease bundleStandaloneRelease --no-daemon \
            -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME=$VERSION_NAME \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify Android signatures
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in android/app/build/outputs/apk/standalone/*/*.apk; do "$signer" verify "$apk"; done
          for aab in android/app/build/outputs/bundle/standaloneRelease/*.aab; do
            if [[ -f "$aab" ]]; then LC_ALL=C jarsigner -verify "$aab" | grep -F 'jar verified.'; fi
          done

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: choo-choo-pop-en-release
          path: |
            android/app/build/outputs/apk/standalone/release/*.apk
            android/app/build/outputs/bundle/standaloneRelease/*.aab

  stores:
    name: Android (${{ matrix.store }})
    needs: prepare
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        store: [bazaar, myket]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Build signed store package
        env:
          STORE: ${{ matrix.store }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BAZAAR_RSA_KEY: ${{ vars.BAZAAR_RSA_KEY }}
          BAZAAR_DEVELOPER_ID: ${{ vars.BAZAAR_DEVELOPER_ID }}
          MYKET_PUBLIC_KEY: ${{ vars.MYKET_PUBLIC_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          METRIX_APP_ID: ${{ secrets.METRIX_APP_ID }}
          METRIX_API_KEY: ${{ secrets.METRIX_API_KEY }}
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_REWARDED_ZONE: ${{ secrets.TAPSELL_REWARDED_ZONE || vars.TAPSELL_REWARDED_ZONE }}
          TAPSELL_INTERSTITIAL_ZONE: ${{ secrets.TAPSELL_INTERSTITIAL_ZONE || vars.TAPSELL_INTERSTITIAL_ZONE }}
        run: npm run build:android
      - name: Verify store signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify out/*.apk
          LC_ALL=C jarsigner -verify out/*.aab | grep -F 'jar verified.'
      - uses: actions/upload-artifact@v7
        with:
          name: choo-choo-pop-store-${{ matrix.store }}
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

  # ---- 3. only when the build is fine: commit the new version, tag it, publish the release ----
  release:
    needs: [prepare, build, stores]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit + tag, create the release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p out
          cp artifacts/choo-choo-pop-en-debug-apk/*.apk "out/choo-choo-pop-v$VERSION-debug.apk"
          release=artifacts/choo-choo-pop-en-release
          if [[ -d "$release" ]]; then
            cp "$release"/apk/standalone/release/*.apk "out/choo-choo-pop-v$VERSION.apk"
            cp "$release"/bundle/standaloneRelease/*.aab "out/choo-choo-pop-v$VERSION.aab"
          fi
          cp artifacts/choo-choo-pop-store-{bazaar,myket}/* out/

      - name: Publish Android release
        run: |
          (cd out && sha256sum *.apk > SHA256SUMS.txt
            if compgen -G '*.aab' > /dev/null; then sha256sum *.aab >> SHA256SUMS.txt; fi)

          tag="v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            test "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")" = "android-build-run:$GITHUB_RUN_ID"
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "android-build-run:$GITHUB_RUN_ID"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --json isDraft > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "Choo Choo Pop $tag" --generate-notes
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --draft=false --latest
          fi

      - name: Record the released version
        run: |
          for attempt in 1 2 3 4 5; do
            if [[ "$(gh release view --json tagName --jq .tagName)" != "v$VERSION" ]]; then exit 0; fi
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git checkout -B release-metadata "origin/$GITHUB_REF_NAME"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            git add package.json package-lock.json
            git diff --cached --quiet && exit 0
            git commit -m "chore(release): v$VERSION [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Could not record the released version."
          exit 1
