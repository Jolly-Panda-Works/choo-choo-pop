name: Send approved Choo Choo Pop 1.8.2 to stores

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-choo-choo-pop-1-8-2
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: bazaar
            script: pishkhan-release.mjs
            digest: a747b431a939ec9a061e2fa6238dc616265dd410e287b33ce3759aa64c028ab9
          - store: myket
            script: myket-release.mjs
            digest: 421a49fa71646b1cf30a2523573a478c5de006a01feb60a6f01eb8983cada914
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download and verify the approved release APK
        env:
          GH_TOKEN: ${{ github.token }}
          STORE: ${{ matrix.store }}
          EXPECTED_SHA256: ${{ matrix.digest }}
        run: |
          apk="choochoopop-v1.8.2-$STORE.apk"
          gh release download v1.8.2 --repo "$GITHUB_REPOSITORY" --pattern "$apk"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$apk" | sha256sum --check
      - name: Submit for public review with automatic publication
        env:
          STORE: ${{ matrix.store }}
          SUBMISSION_SCRIPT: ${{ matrix.script }}
          BAZAAR_PISHKHAN_TOKEN: ${{ matrix.store == 'bazaar' && secrets.BAZAAR_PISHKHAN_TOKEN || '' }}
          MYKET_ACCESS_TOKEN: ${{ matrix.store == 'myket' && secrets.MYKET_ACCESS_TOKEN || '' }}
          BAZAAR_CHANNEL: public
          BAZAAR_AUTO_PUBLISH: 'true'
          MYKET_AUTO_PUBLISH: 'true'
        run: node "scripts/$SUBMISSION_SCRIPT" "choochoopop-v1.8.2-$STORE.apk" --version 1.8.2 --code 1008002 --changelog store-release-notes.json
