name: Send approved Choo Choo Pop 1.9.0 to stores

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-choo-choo-pop-1-9-0
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: bazaar
            script: pishkhan-release.mjs
            digest: b6559f65a3992a93bec3f2eeff2535a3033aec9c91e4bd41a65f20361d5a5843
          - store: myket
            script: myket-release.mjs
            digest: 806b8d01a4eef067838840a4153f016dfec083c80305fb3d0cc223369e34e198
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download and verify the approved release APK
        env:
          GH_TOKEN: ${{ github.token }}
          STORE: ${{ matrix.store }}
          EXPECTED_SHA256: ${{ matrix.digest }}
        run: |
          apk="choochoopop-v1.9.0-$STORE.apk"
          gh release download v1.9.0 --repo "$GITHUB_REPOSITORY" --pattern "$apk"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$apk" | sha256sum --check
      - name: Submit for public review with automatic publication
        env:
          STORE: ${{ matrix.store }}
          SUBMISSION_SCRIPT: ${{ matrix.script }}
          BAZAAR_PISHKHAN_TOKEN: ${{ matrix.store == 'bazaar' && secrets.BAZAAR_PISHKHAN_TOKEN || '' }}
          MYKET_ACCESS_TOKEN: ${{ matrix.store == 'myket' && secrets.MYKET_ACCESS_TOKEN || '' }}
          BAZAAR_CHANNEL: public
          BAZAAR_AUTO_PUBLISH: 'true'
          MYKET_AUTO_PUBLISH: 'true'
        run: node "scripts/$SUBMISSION_SCRIPT" "choochoopop-v1.9.0-$STORE.apk" --version 1.9.0 --code 1009000 --changelog store-release-notes.json
