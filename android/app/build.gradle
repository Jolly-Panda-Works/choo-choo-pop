apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def tapsell = ['app_key': 'TAPSELL_APP_KEY', 'rewarded_zone': 'TAPSELL_REWARDED_ZONE',
               'interstitial_zone': 'TAPSELL_INTERSTITIAL_ZONE'].collectEntries { name, variable ->
    [(name): System.getenv(variable)?.trim() ?: '']
}
if (tapsell.values().any { it } && !tapsell.values().every { it ==~ /[a-zA-Z0-9-]{8,128}/ }) {
    throw new GradleException('Tapsell requires an app key and two valid zone IDs.')
}

def localSettings = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.isFile()) localFile.withInputStream { localSettings.load(it) }
def metrixId = System.getenv('METRIX_APP_ID')?.trim()
def metrixKey = System.getenv('METRIX_API_KEY')?.trim()
if (!metrixId && !metrixKey) {
    metrixId = localSettings.getProperty('metrix.appId')?.trim()
    metrixKey = localSettings.getProperty('metrix.apiKey')?.trim()
}
if (!!metrixId != !!metrixKey) throw new GradleException('Set both Metrix SDK credentials.')
android {
    namespace = "com.jollypanda.choochoopop"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        // Bazaar's login check service (src/bazaar/aidl)
        aidl = true
    }
    // One build per store: same app id and version, each with its own SDKs, manifest and plugin (src/<store>)
    flavorDimensions = ['store']
    productFlavors {
        standalone {
            dimension = 'store'
        }
        bazaar {
            dimension = 'store'
            tapsell.each { name, value -> resValue 'string', "tapsell_${name}", value ?: '""' }
        }
        myket {
            dimension = 'store'
            tapsell.each { name, value -> resValue 'string', "tapsell_${name}", value ?: '""' }
            // read by the manifest of ir.myket:billing
            manifestPlaceholders = [
                marketApplicationId: 'ir.mservices.market',
                marketBindAddress: 'ir.mservices.market.InAppBillingService.BIND',
                marketPermission: 'ir.mservices.market.BILLING',
            ]
        }
    }
    sourceSets {
        if (metrixId) {
            release.java.srcDirs += 'src/metrix/java'
            release.manifest.srcFile 'src/metrix/AndroidManifest.xml'
        }
        bazaar.java.srcDirs += 'src/bazaar/kotlin'
        myket.java.srcDirs += 'src/myket/kotlin'
        bazaar.java.srcDirs += 'src/storeAds/java'
        myket.java.srcDirs += 'src/storeAds/java'
    }
    defaultConfig {
        applicationId "com.jollypanda.choochoopop"
        tapsell.each { name, value -> resValue 'string', "tapsell_${name}", '""' }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // "=" is required: without it Groovy reads `versionCode (x).toInteger()` as `versionCode(x).toInteger()`
        versionCode = (project.findProperty('VERSION_CODE') ?: '1').toInteger()
        versionName = (project.findProperty('VERSION_NAME') ?: '1.1.0').toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            tapsell.each { name, value -> resValue 'string', "tapsell_${name}", '""' }
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            manifestPlaceholders += [metrixAppId: metrixId ?: '', metrixApiKey: metrixKey ?: '']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    if (metrixId) releaseImplementation 'ir.metrix.analytics:metrix:2.10.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Cafe Bazaar: in-app billing (Poolakey), sign in + in-app storage (CafeBazaarAuth), in-app update (bazaarUpdater)
    bazaarImplementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    bazaarImplementation "com.github.cafebazaar.CafeBazaarAuth:auth:1.1.0"
    bazaarImplementation "com.github.cafebazaar:bazaarUpdater:1.2.0"
    bazaarImplementation "ir.tapsell.sdk:tapsell-sdk-android:4.9.15"
    myketImplementation "ir.tapsell.sdk:tapsell-sdk-android:4.9.15"
    // Myket: in-app billing
    myketImplementation "ir.myket:billing:2.2"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
