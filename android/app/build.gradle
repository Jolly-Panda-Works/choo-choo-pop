apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Two store builds of the same game (both languages are in each, see Settings):
//   ./gradlew assembleRelease -PEDITION=en   -> "Choo Choo Pop"   (com.jollypanda.choochoopop), starts in English
//   ./gradlew assembleRelease -PEDITION=fa   -> "هو هو چی چی"      (com.jollypanda.choochoopop.fa), Cafe Bazaar, starts in Persian
// The web bundle must be built for the same store first (npm run cap:sync / cap:sync:bazaar).
def edition = (project.findProperty('EDITION') ?: 'en').toString()
if (!['en', 'fa'].contains(edition)) {
    throw new GradleException("EDITION must be 'en' or 'fa' (got '${edition}')")
}

android {
    namespace = "com.jollypanda.choochoopop"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        // Bazaar's login check service (src/edition-fa/aidl)
        aidl = (edition == 'fa')
    }
    sourceSets {
        // edition-specific app name lives in src/edition-<en|fa>/res/values/app_name.xml
        main.res.srcDirs += "src/edition-${edition}/res"
        // edition-specific native code: src/edition-fa has the Cafe Bazaar billing plugin, src/edition-en an empty list
        main.java.srcDirs += "src/edition-${edition}/kotlin"
        main.aidl.srcDirs += "src/edition-${edition}/aidl"
    }
    defaultConfig {
        applicationId "com.jollypanda.choochoopop" + (edition == 'fa' ? '.fa' : '')
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // "=" is required: without it Groovy reads `versionCode (x).toInteger()` as `versionCode(x).toInteger()`
        versionCode = (project.findProperty('VERSION_CODE') ?: '1').toInteger()
        versionName = (project.findProperty('VERSION_NAME') ?: '1.1.0').toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Cafe Bazaar - Persian edition only: in-app billing (Poolakey), sign in + in-app storage (CafeBazaarAuth),
    // in-app update (bazaarUpdater). Same versions as Mini Sumo; override with -PPOOLAKEY_VERSION=x.y.z etc.
    if (edition == 'fa') {
        implementation "com.github.cafebazaar.Poolakey:poolakey:${project.findProperty('POOLAKEY_VERSION') ?: '2.2.0'}"
        implementation "com.github.cafebazaar.CafeBazaarAuth:auth:${project.findProperty('BAZAAR_AUTH_VERSION') ?: '1.1.0'}"
        implementation "com.github.cafebazaar:bazaarUpdater:${project.findProperty('BAZAAR_UPDATER_VERSION') ?: '1.2.0'}"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
